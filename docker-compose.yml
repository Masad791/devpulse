# Local Postgres for development: `npm run db:up`. Production uses a hosted Postgres (e.g. Neon) via DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse
      POSTGRES_DB: devpulse
    ports:
      - "54329:5432" # unusual host port so it never clashes with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
